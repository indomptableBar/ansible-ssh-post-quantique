# /etc/ssh/sshd_config.d/99-pqc.conf

# Échange de clés hybride post-quantique
KexAlgorithms mlkem768x25519-sha256,curve25519-sha256

# Authentification par clé classique moderne
PubkeyAuthentication yes

# Désactiver les algorithmes de clé utilisateur obsolètes
PubkeyAcceptedAlgorithms ssh-ed25519

# Ne pas autoriser root directement
PermitRootLogin no
